name: android-apk

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NOTE: no setup-android step — android-actions/setup-android@v3
      # fails because it installs the obsolete `tools` package, and
      # sdkmanager is NOT on PATH on ubuntu-latest (ubuntu-26.04 image).
      # The SDK lives at /usr/local/lib/android/sdk (cmdline-tools 16.0);
      # use its sdkmanager by full path and export ANDROID_HOME for Gradle.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      # ONE-TIME: the committed debug.keystore was generated with pyjks
      # and JDK's signer rejects its private key (InvalidKeyException).
      # Generate a REAL keytool keystore here, upload it as an artifact,
      # then commit it and restore the "Check committed debug keystore"
      # step. v1.0/v1.1 proved CI-generated keytool keystores sign fine.
      - name: Generate stable debug keystore (one-time; will be committed)
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Upload debug keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore

      # The secrets Gradle plugin expects its default properties file to
      # exist; the repo intentionally does not contain it (placeholder only).
      - name: Create placeholder .env.example
        run: printf '# GEMINI_API_KEY=\n' > .env.example

      # Binary assets are stored base64-encoded under assets-b64/ (the
      # upload channel only supports UTF-8 text); decode them into place.
      - name: Decode binary assets
        run: bash scripts/decode-assets.sh

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
